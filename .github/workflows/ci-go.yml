name: GO sandbox CI
on: 
    push:
        branches:
            - "**"
        paths:
            - "go/**"
    pull_request:
        branches:
            - main
        paths:
            - "go/**"
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4 #for git clone
            - uses: actions/setup-go@v5
              with:
                go-version: "1.27"
            - name: run go tests
              working-directory: "./go"
              run: for d in */; do (cd "$d" && go test ./...); done #to execute all tests recursively